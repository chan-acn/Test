# This is a workflow for GitHub Repository Custom Code Quality Scanning Enablement.
name: Custom Code Quality Scan
 
on:
  pull_request_target:
    branches: [ "main" ]
 
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: ./codeql-custom-queries
          config-file: ./.github/codeql/config.yml
 
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          output: results.sarif
          upload: false
 
      - name: Check for violations
        run: |
          count=$(cat results.sarif/*.sarif | jq -s '[.[].runs[].results[]] | length')
          echo "Found $count result(s)"
          if [ "$count" -gt "0" ]; then
            echo "Custom query violations found, blocking PR"
            exit 1
          fi
 
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: "/language:${{ matrix.language }}"
