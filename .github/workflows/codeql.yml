# This is a workflow for GitHub Repository Custom Code Quality Scanning Enablement.
name: Custom Code Quality Scan
on:
  pull_request:
    branches: [ "Test" ]
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: ./codeql-custom-queries
          config-file: ./.github/codeql/config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          output: results.sarif
          upload: false

      - name: Print SARIF results
        run: |
          cat results.sarif/javascript.sarif | jq '[.runs[].results[] | {rule: .ruleId, message: .message.text, file: .locations[0].physicalLocation.artifactLocation.uri, line: .locations[0].physicalLocation.region.startLine}]'

      - name: Check for violations (warn only)
        id: scan
        run: |
          count=$(cat results.sarif/*.sarif | jq -s '[.[].runs[].results[]] | length')
          echo "count=$count" >> $GITHUB_OUTPUT
          echo "Found $count result(s)"
          if [ "$count" -gt "0" ]; then
            # Save violations as JSON for artifact upload + comment link
            cat results.sarif/*.sarif | jq -s '
              [.[].runs[].results[] | {
                rule: .ruleId,
                message: .message.text,
                file: .locations[0].physicalLocation.artifactLocation.uri,
                line: .locations[0].physicalLocation.region.startLine
              }]
            ' > violations.json
            # Warning annotations on PR diff
            cat results.sarif/*.sarif | jq -r '
              .runs[].results[] |
              "::warning file=\(.locations[0].physicalLocation.artifactLocation.uri),line=\(.locations[0].physicalLocation.region.startLine)::\(.ruleId) — \(.message.text)"
            '
          else
            echo "No violations found."
          fi

      # ✅ NEW: Upload cat_custom_codescan.json as a downloadable artifact
      - name: Upload Code Scan Report
        if: steps.scan.outputs.count > 0
        uses: actions/upload-artifact@v4
        with:
          name: cat-custom-codescan
          path: cat_custom_codescan.json
          retention-days: 14

      - name: Post PR Comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const count = parseInt('${{ steps.scan.outputs.count }}' || '0');
            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            let body = '';
            if (count > 0) {
              body = `## ⚠️ Custom Code Scan\n\n` +
                     `A full report has been uploaded as a downloadable artifact.\n\n` +
                     `📎 **[Download \`cat_custom_codescan.json\`](${runUrl})** — ` +
                     `navigate to the run page and find **cat-custom-codescan** under *Artifacts*.\n\n` +
                     `> Please review the violations. PR is still mergeable.`;
            } else {
              body = `## ✅ Code Scan Passed\n`;
            }

            // Delete previous bot comment if exists, then post fresh
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const botComment = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('Code Scan')
            );
            if (botComment) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id
              });
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
