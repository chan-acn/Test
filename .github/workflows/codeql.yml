# This is a workflow for GitHub Repository Custom Code Quality Scanning Enablement.
name: Custom Code Quality Scan

on:
  pull_request:
    branches: [ "Child_Test" ]

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: ./codeql-custom-queries
          config-file: ./.github/codeql/config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          output: results.sarif
          upload: false

      - name: Print SARIF results
        run: |
          cat results.sarif/javascript.sarif | jq '[.runs[].results[] | {rule: .ruleId, message: .message.text, file: .locations[0].physicalLocation.artifactLocation.uri, line: .locations[0].physicalLocation.region.startLine}]'

      - name: Check for violations (warn only)
        run: |
          count=$(cat results.sarif/*.sarif | jq -s '[.[].runs[].results[]] | length')
          echo "Found $count result(s)"
          if [ "$count" -gt "0" ]; then

            # ── Write to Job Summary (visible in PR check) ──────────────
            echo "## ⚠️ Code Scan Violations Found" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Rule | Message | File | Line |" >> $GITHUB_STEP_SUMMARY
            echo "|------|---------|------|------|" >> $GITHUB_STEP_SUMMARY
            cat results.sarif/*.sarif | jq -r '
              .runs[].results[] |
              "| \(.ruleId) | \(.message.text) | \(.locations[0].physicalLocation.artifactLocation.uri) | \(.locations[0].physicalLocation.region.startLine) |"
            ' >> $GITHUB_STEP_SUMMARY

            # ── Warning annotations on PR diff ───────────────────────────
            cat results.sarif/*.sarif | jq -r '
              .runs[].results[] |
              "::warning file=\(.locations[0].physicalLocation.artifactLocation.uri),line=\(.locations[0].physicalLocation.region.startLine)::\(.ruleId) — \(.message.text)"
            '

            # ✅ No exit 1 — workflow always passes

          else
            echo "## ✅ No Violations Found" >> $GITHUB_STEP_SUMMARY
            echo "No violations found."
          fi

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: "/language:${{ matrix.language }}"
